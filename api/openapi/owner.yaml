          format: uuid
        membershipId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - revoked
        displaySuffix:
          type: string
        redemptionDeadline:
          type: string
          format: date-time
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - occurredAt
        - actor
        - eventType
        - outcome
        - entityType
        - correlationId
        - details
      properties:
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
          enum: [owner, system, anonymous]
        eventType:
          type: string
        outcome:
          type: string
          enum: [succeeded, failed, denied]
        entityType:
          type: string
        correlationId:
          type: string
        details:
          type: object
          additionalProperties: true
    AuditEventList:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    DataProtectionStatus:
      type: object
      additionalProperties: false
      required:
        - recoveryGate
        - retentionReady
        - pendingRelationships
        - backupRetentionDays
      properties:
        recoveryGate:
          type: string
          enum: [closed, open]
        lastCleanupAt:
          type: string
          format: date-time
          nullable: true
        lastCleanupCycle:
          type: string
          nullable: true
        retentionReady:
          type: boolean
        pendingRelationships:
          type: integer
          minimum: 0
        backupRetentionDays:
          type: integer
          const: 7
    OpenRecoveryGateRequest:
      type: object
      additionalProperties: false
      required:
        - restoredAt
      properties:
        restoredAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
        detail:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
        actualCount:
          type: integer
          format: int64
          minimum: 0
          description: Exact scope or projected size when the limit is exceeded.
    ProxySourceRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [direct, subscription, cliproxy, b2proxy, proxy1024] }
        label: { type: string, maxLength: 120 }
        url: { type: string, maxLength: 4096 }
        username: { type: string, maxLength: 200 }
        password: { type: string, maxLength: 500 }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string, enum: [socks5h, http, https] }
        country: { type: string, minLength: 2, maxLength: 2 }
        state: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        sessionType: { type: string, enum: [sticky, rotating] }
        sessionMinutes: { type: integer, minimum: 1, maximum: 180 }
        updateSeconds: { type: integer, minimum: 60, maximum: 86400 }
    ProxyDiagnosticStep:
      type: object
      required: [stage, code, httpStatus, durationMs]
      properties:
        stage: { type: string }
        code: { type: string }
        httpStatus: { type: integer }
        durationMs: { type: integer, format: int64 }
    ProxySourceDiagnostic:
      type: object
      required: [passed, steps]
      properties:
        passed: { type: boolean }
        steps:
          type: array
          items: { $ref: '#/components/schemas/ProxyDiagnosticStep' }
    ProxyProvider:
      type: object
      required: [kind, label, host, port, minMinutes, maxMinutes]
      properties:
        kind: { type: string }
        label: { type: string }
        host: { type: string }
        port: { type: integer }
        minMinutes: { type: integer }
        maxMinutes: { type: integer }
    ProxyNodeImportRequest:
      type: object
      additionalProperties: false
      required: [proxies]
      properties:
        proxies:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, maxLength: 2048 }
    ProxyTaskCapacity:
      type: object
      required: [mode, taskConcurrency, healthyCount]
      properties:
        mode: { type: string, enum: [direct, proxy_required] }
        taskConcurrency: { type: integer }
        healthyCount: { type: integer }
    ProxyPoolSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        targetHealthy: { type: integer, minimum: 1, maximum: 1000 }
        probeConcurrency: { type: integer, minimum: 1, maximum: 100 }
        taskConcurrency: { type: integer, minimum: 1, maximum: 100 }
    ProxyPoolSource:
      type: object
      additionalProperties: false
      required: [id, kind, label, urlMasked, enabled, config, usernameSet, passwordSet]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [subscription, cliproxy, b2proxy, proxy1024] }
        label: { type: string }
        urlMasked: { type: string }
        enabled: { type: boolean }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string }
        config: { $ref: '#/components/schemas/ProxySourceRequest' }
        usernameSet: { type: boolean }
        passwordSet: { type: boolean }
    ProxyPoolNode:
      type: object
      additionalProperties: false
      required: [id, scheme, displayHost, state, failureReason, leaseCount, sourceKind, region, sessionKey, diagnostics]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid, nullable: true }
        scheme: { type: string, enum: [http, https, socks5, socks5h] }
        displayHost: { type: string }
        state: { type: string, enum: [pending, healthy, isolated] }
        failureReason: { type: string }
        checkedAt: { type: string, format: date-time, nullable: true }
        healthyAt: { type: string, format: date-time, nullable: true }
        leaseCount: { type: integer, minimum: 0 }
        sourceKind: { type: string }
        region: { type: string }
        sessionKey: { type: string }
        stableUntil: { type: string, format: date-time, nullable: true }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/ProxyDiagnosticStep' }
    ProxyVerification:
      type: object
      required: [removedCount, retryCount, diagnostics]
      properties:
        removedCount: { type: integer, minimum: 0 }
        retryCount: { type: integer, minimum: 0 }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/ProxyDiagnosticStep' }
    ProxyPool:
      type: object
      additionalProperties: false
      required: [mode, targetHealthy, healthyCount, pendingCount, isolatedCount, activeLeases, probeConcurrency, taskConcurrency, page, pageSize, total, nodes, sources, providers, refillRequested, refillGenerated, refillSucceeded, refilling]
      properties:
        mode: { type: string, enum: [direct, proxy_required] }
        targetHealthy: { type: integer, minimum: 1 }
        healthyCount: { type: integer, minimum: 0 }
        pendingCount: { type: integer, minimum: 0 }
        isolatedCount: { type: integer, minimum: 0 }
        activeLeases: { type: integer, minimum: 0 }
        probeConcurrency: { type: integer, minimum: 1 }
        taskConcurrency: { type: integer, minimum: 1 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        sources:
          type: array
          items: { $ref: '#/components/schemas/ProxyPoolSource' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProxyProvider' }
        verification: { $ref: '#/components/schemas/ProxyVerification' }
        refilling: { type: boolean }
        refillRequested: { type: integer }
        refillGenerated: { type: integer }
        refillSucceeded: { type: integer }
        lastRefillAt: { type: string, format: date-time, nullable: true }
        source: { $ref: '#/components/schemas/ProxyPoolSource', nullable: true }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ProxyPoolNode' }
