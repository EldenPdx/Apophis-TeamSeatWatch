          $ref: '#/components/responses/Problem'
  /api/owner/v1/data-protection/recovery-open:
    post:
      operationId: openRecoveryGate
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenRecoveryGateRequest'
      responses:
        '200':
