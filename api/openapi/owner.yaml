  /api/owner/v1/proxy-pool:
    get:
      operationId: getProxyPool
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: state, in: query, schema: { type: string, enum: [pending, healthy, isolated] } }
        - { name: source_kind, in: query, schema: { type: string, enum: [manual, subscription, cliproxy, b2proxy, proxy1024] } }
      responses:
        '200':
          description: Redacted Owner proxy pool state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPool' }
        default: { $ref: '#/components/responses/Problem' }
  /api/owner/v1/proxy-pool/source:
    put:
      operationId: putProxySource
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProxySourceRequest' }
      responses:
        '200':
          description: Subscription saved and synchronized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPool' }
        default: { $ref: '#/components/responses/Problem' }
  /api/owner/v1/proxy-pool/sync:
    post:
      operationId: syncProxyPool
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Sources synchronized and candidates verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPool' }
        default: { $ref: '#/components/responses/Problem' }
  /api/owner/v1/proxy-pool/nodes/import:
    post:
      operationId: importProxyNodes
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProxyNodeImportRequest' }
      responses:
        '200':
          description: Manual nodes saved and verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPool' }
        default: { $ref: '#/components/responses/Problem' }
  /api/owner/v1/proxy-pool/probe:
    post:
      operationId: probeProxyPool
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Candidates probed and health state updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPool' }
        default: { $ref: '#/components/responses/Problem' }
  /api/owner/v1/proxy-pool/nodes/{nodeId}:
    delete:
      operationId: removeProxyNode
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Node removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPool' }
        default: { $ref: '#/components/responses/Problem' }
  /api/owner/v1/proxy-pool/settings:
    get:
      operationId: getProxyTaskCapacity
      security: [{ ownerSession: [] }]
      responses:
        '200':
          description: Shared business concurrency ceiling
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyTaskCapacity' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateProxyPoolSettings
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProxyPoolSettingsRequest' }
      responses:
        '200':
          description: Runtime pool settings saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPool' }
        default: { $ref: '#/components/responses/Problem' }
  /api/owner/v1/proxy-pool/source/test:
    post:
      operationId: testProxySource
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProxySourceRequest' }
      responses:
        '200':
          description: Draft tested without changing saved config or admitted routes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxySourceDiagnostic' }
        default: { $ref: '#/components/responses/Problem' }
  /api/owner/v1/proxy-pool/nodes/{nodeId}/probe:
    post:
      operationId: probeProxyNode
      security: [{ ownerSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One node revalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProxyPool' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: tsw_session
  parameters:
    RedemptionMother:
      name: mother_account_id
      in: query
      required: true
      schema: {type: string, format: uuid}
    RedemptionWorkspace:
      name: workspace_id
      in: query
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AccountSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_desc
          - name_asc
    WorkspaceSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - updated_desc
          - name_asc
          - active_until_asc
    WorkspaceStateFilter:
      name: operational_state
      in: query
      schema:
        type: string
        enum:
          - unknown
          - operational
          - deactivated
          - not_found
    ObservationPage:
      name: observation_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    ObservationPageSize:
      name: observation_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MemberPage:
      name: member_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    MemberPageSize:
      name: member_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TargetSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_desc
          - identifier_asc
          - probed_desc
    TargetStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
          - active
          - disabled
    TargetProbeStatusFilter:
      name: probe_status
      in: query
      schema:
        type: string
        enum:
          - available
          - credential_invalid
          - account_problem
          - definitely_unavailable
          - transient_failure
          - unknown
          - unprobed
    TargetTokenStatusFilter:
      name: token_status
      in: query
      description: Saved token presence, independent of expiry or probe health.
      schema:
        type: string
        enum: [has_at, missing_at, has_rt, missing_rt, both, none]
    StandbyMembershipFilter:
      name: membership_status
      in: query
      schema:
        type: string
        enum: [unassigned, assigned]
    StandbyBatchFilter:
      name: standby_batch_id
      in: query
      schema:
        type: string
        format: uuid
    ExcludedStandbyBatchFilter:
      name: exclude_standby_batch_id
      in: query
      schema:
        type: string
        format: uuid
    TargetDomainFilter:
      name: domain
      in: query
      description: Exact email domain, case insensitive, optionally prefixed with @.
      schema:
        type: string
        maxLength: 254
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 254
    BindingId:
      name: binding_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    TargetPage:
      name: target_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    TargetPageSize:
      name: target_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReadId:
      name: readId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StandbyBatchId:
      name: standbyBatchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetAccountId:
      name: targetAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProbeId:
      name: probeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetAccountIdQuery:
      name: target_account_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    DeliveryServiceStatusQuery:
      name: service_status
      in: query
      schema:
        $ref: '#/components/schemas/DeliveryServiceFilter'
    DeliveryCardStatusQuery:
      name: card_status
      in: query
      schema:
        $ref: '#/components/schemas/DeliveryCardFilter'
    DeliveryOrderStatusQuery:
      name: order_status
      in: query
      schema:
        $ref: '#/components/schemas/DeliveryOrderFilter'
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OperationDraftChild:
      type: object
      additionalProperties: false
      required: [accountId, membershipVersion]
      properties:
        accountId:
          type: string
          format: uuid
        membershipVersion:
          type: integer
          format: int64
    RotationRemovalAction:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: {type: boolean}
    RotationRemovalStart:
      type: object
      additionalProperties: false
      required: [confirmed, authorizationDigest, idempotencyKey]
      properties:
        confirmed: {type: boolean}
        authorizationDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        idempotencyKey: {type: string, format: uuid}
    RotationRemoval:
      type: object
      additionalProperties: false
      required:
        - previewId
        - workspaceId
        - workspaceName
        - createdAt
        - authorizationDigest
        - stopped
        - writeAllowed
        - slots
      properties:
        previewId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        workspaceName: {type: string}
        createdAt: {type: string, format: date-time}
        authorizationDigest: {type: string}
        stopped: {type: boolean}
        writeAllowed: {type: boolean}
        slots:
          type: array
          items: {$ref: '#/components/schemas/RotationRemovalSlot'}
    RotationRemovalHistory:
      type: object
      additionalProperties: false
      required: [items, page, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RotationRemovalHistoryItem'}
        page: {type: integer}
        total: {type: integer}
    RotationRemovalHistoryItem:
      type: object
      additionalProperties: false
      required: [previewId, workspaceName, createdAt, stopped]
      properties:
        previewId: {type: string, format: uuid}
        workspaceName: {type: string}
        createdAt: {type: string, format: date-time}
        stopped: {type: boolean}
    RotationRemovalSlot:
      type: object
      additionalProperties: false
      required:
        - id
        - platformMemberId
        - originalAccountId
        - candidateAccountId
        - identifier
        - seatType
        - state
        - attemptCount
        - leaseEpoch
        - uncertainObligation
        - lastErrorCode
        - updatedAt
        - candidateReady
      properties:
        id: {type: string, format: uuid}
        platformMemberId: {type: string}
        originalAccountId: {type: string, format: uuid}
        candidateAccountId: {type: string, format: uuid}
        identifier: {type: string}
        seatType: {type: string}
        state:
          type: string
          enum:
            - pending
            - lease_acquired
            - remove_requested
            - remote_result_uncertain
            - absent_verification_pending
            - absent_verified
            - blocked
            - stopped
        attemptCount: {type: integer}
        leaseEpoch: {type: integer, format: int64}
        leaseExpiresAt: {type: string, format: date-time}
        remoteRequestId: {type: string, format: uuid}
        verificationId: {type: string, format: uuid}
        uncertainObligation: {type: boolean}
        lastErrorCode: {type: string}
        updatedAt: {type: string, format: date-time}
        candidateReady: {type: boolean}
    RotationJoinAction:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: {type: boolean}
    ChannelDeliveryStatus:
      type: object
      additionalProperties: false
      required: [previewId, workspaceId, phase, nextAction, receivedCount, deliveredCount, objects]
      properties:
        previewId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        packageId: {type: string, format: uuid}
        destinationName: {type: string}
        phase: {type: string, enum: [pending, ready, receiving, received, partial, delivered, blocked]}
        nextAction: {type: string, enum: [none, receive, reconcile]}
        receivedCount: {type: integer, minimum: 0, maximum: 999}
        deliveredCount: {type: integer, minimum: 0, maximum: 999}
        objects:
          type: array
          maxItems: 999
          items: {$ref: '#/components/schemas/ChannelDeliveryObject'}
    ChannelDeliveryObject:
      type: object
      additionalProperties: false
      required: [accountId, slotId, identifier, reception, delivery]
      properties:
        accountId: {type: string, format: uuid}
        slotId: {type: string, format: uuid}
        identifier: {type: string}
        reception: {type: string, enum: [pending, receipt_pending, record_pending, received]}
        delivery: {type: string, enum: [pending, record_pending, delivered]}
    BatchZIPStatus:
      type: object
      additionalProperties: false
      required: [previewId, workspaceId, accountCount, phase, nextAction, canGenerate]
      properties:
        previewId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        accountCount: {type: integer, minimum: 0}
        phase: {type: string, enum: [pending, prepared, reserved, delivered]}
        nextAction: {type: string, enum: [none, generate, download]}
        canGenerate: {type: boolean}
        packageId: {type: string, format: uuid}
        filename: {type: string}
        createdAt: {type: string, format: date-time}
    RotationJoinStatus:
      type: object
      additionalProperties: false
      required:
        - previewId
        - slotId
        - workspaceId
        - candidateIdentifier
        - phase
        - membership
        - credentials
        - nextAction
        - diagnostic
        - usage
        - deliveryReady
      properties:
        previewId: {type: string, format: uuid}
        slotId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        candidateIdentifier: {type: string}
        phase: {type: string}
        membership: {type: string}
        credentials: {type: string}
        nextAction: {type: string}
        diagnostic: {type: string}
        usage: {type: string}
        deliveryReady: {type: boolean}

    ExpiryRotationAssignment:
      type: object
      additionalProperties: false
      required: [platformMemberId, accountId]
      properties:
        platformMemberId:
          type: string
        accountId:
          type: string
          format: uuid
    ExpiryRotationConfirmation:
      type: object
      additionalProperties: false
      required: [confirmed, digest, idempotencyKey, assignments]
      properties:
        confirmed:
          type: boolean
        digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        idempotencyKey:
          type: string
          format: uuid
        assignments:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ExpiryRotationAssignment'
    ExpiryRotationSlot:
      type: object
      additionalProperties: false
      required:
        - identifier
        - platformMemberId
        - accountId
        - seatType
        - usageState
        - everUsed
        - protectionStatus
        - decision
        - reason
      properties:
        accountId:
          type: string
          format: uuid
        usageState:
          type: string
          enum: [unknown, used, never_used]
        everUsed:
          type: boolean
        protectionStatus:
          type: string
          enum:
            - unknown
            - none
            - delivered
            - canceled_retired
            - sale_reserved
            - delivery_pending
            - suspected_sold
        identifier:
          type: string
        platformMemberId:
          type: string
        seatType:
          type: string
        decision:
          type: string
          enum: [replaceable, retained, needs_verification]
        reason:
          type: string
    ExpiryRotationCandidate:
      type: object
      additionalProperties: false
      required:
        - accountId
        - identifier
        - seatType
        - usageState
        - everUsed
        - protectionStatus
        - decision
        - deliveryStatus
        - reason
      properties:
        accountId:
          type: string
          format: uuid
        usageState:
          type: string
          enum: [unknown, used, never_used, unobserved_prejoin]
        everUsed:
          type: boolean
        protectionStatus:
          type: string
          enum:
            - unknown
            - none
            - delivered
            - canceled_retired
            - sale_reserved
            - delivery_pending
            - suspected_sold
        identifier:
          type: string
        seatType:
          type: string
        decision:
          type: string
          enum: [eligible, excluded]
        deliveryStatus:
          type: string
          description: >-
            Pre-join candidates are never deliverable. Delivery requires a
            separately persisted post-join scoped zero observation.
          enum: [blocked, join_candidate_pending_first_probe, deliverable]
        reason:
          type: string
    ExpiryRotationPreview:
      type: object
