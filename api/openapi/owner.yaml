        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: actor
          in: query
          schema:
            type: string
            enum: [owner, system, anonymous]
        - name: event_type
          in: query
          schema:
            type: string
            maxLength: 128
        - name: outcome
          in: query
          schema:
            type: string
            enum: [succeeded, failed, denied]
        - name: workspace_id
          in: query
          schema:
            type: string
            format: uuid
        - name: batch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: membership_id
          in: query
          schema:
            type: string
            format: uuid
        - name: order_id
